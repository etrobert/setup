---
# workmux global config. Read from $XDG_CONFIG_HOME/workmux/config.yaml, which
# the wrapper points at this file's store directory.

# One tmux session per worktree, matching tmux-sessionizer. tmux-only upstream.
mode: session

# Upstream prefixes session names with "wm-".
window_prefix: ""

files:
  copy:
    - .env
    - .tmux.conf
    - .claude/settings.local.json

# Whether workmux rewrites tmux's window-status-format at runtime to render its
# marker in the window tabs. Off because it inserts before #{window_flags} /
# #{F} and our format has neither, so it appends after the trailing
# #{?window_end_flag,...} colour transition and paints the icon outside the tab.
# tmux.conf reads @workmux_status directly instead, and from status-left rather
# than the tabs, so every session shows and not just the attached one.
status_format: false

# Pinned rather than left at the emoji defaults because tmux.conf highlights a
# blocked agent by matching the waiting icon: change these and change it too.
status_icons:
  working: "•"
  waiting: "!"
  done: "✓"

# Nerd-font glyphs for PR, git and CI status in `workmux list` and the
# dashboard. Set explicitly: left unset, the first-run wizard prompts and then
# warns on every run because it cannot write the answer back to a store path.
nerdfont: true
