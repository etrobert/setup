[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Pink"
source = "community"

# Plugins are opt-in by id, and declaring a source replaces the default
# (which scans the data dir), so nothing outside the store is scanned.
[plugins]
enabled = [
  "etrobert/weekday",
  "noctalia/bitwarden",
  "avivbintangaringga/nix-monitor",
]

[[plugins.source]]
kind = "path"
name = "setup"
location = "@plugins@"

[[plugins.source]]
kind = "path"
name = "official"
location = "@official-plugins@"

[[plugins.source]]
kind = "path"
name = "community"
location = "@community-plugins@"

[location]
address = "Berlin"

# Attached panels draw on the bar's own surface and inherit its
# background_opacity, which a transparent bar makes unreadable over windows.
# Floating panels get their own surface, taking opacity from
# transparency_mode — "solid" by default. launcher, clipboard and polkit
# float already.
[shell.panel]
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"

[shell.launcher.dmenu.entry.clipboard]
command = 'printf "Clipboard history\tSearch and paste copied items\n"'
exec = "noctalia msg panel-open clipboard"
prefix = "clip"
label = "Clipboard"
glyph = "clipboard"
global = true

[bar.main]
position = "left"
scale = 1.2

widget_spacing = 12
margin_opposite_edge = 5
margin_edge = 5
margin_ends = 0
padding = 12

# Show the wallpaper through the bar instead of the Surface fill. noctalia
# also asks the compositor to blur behind its surfaces with no setting to
# stop it, so niri refuses that via a layer-rule on the noctalia- namespaces.
background_opacity = 0.0

start = ["clock", "etrobert/weekday:bar", "date"]
center = ["temp", "cpu", "ram"]
end = [
  "media",
  "tray",
  "notifications",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "power_profile",
  "avivbintangaringga/nix-monitor:nix-monitor",
  "control-center",
  "workspaces",
  "session",
]

[wallpaper.default]
path = "@wallpaper@"

# Reaching the monitor over DDC/CI needs hardware.i2c.enable for /dev/i2c-*.
[brightness]
enable_ddcutil = true

# Sunrise and sunset are derived from [location] above. The default 6500K day
# and 4000K night are the temperatures we already ran.
[nightlight]
enabled = true

# Firefox and Zen request timeout=0 for notifications like Google Calendar
# reminders. allow_permanent = false expires them on the default timeout
# instead. match is case-insensitive against app name, desktop entry or
# category.
[notification.filter.firefox]
match = "firefox"
allow_permanent = false

[notification.filter.zen]
match = "zen"
allow_permanent = false

[widget.clock]
vertical_format = "{:%H %M %S}"

[widget.date]
format = "{:%d %m %y}"

[widget.brightness]
show_label = false

# The status text overflows the narrow vertical bar; the glyph alone
# carries the state, like the other bar widgets with show_label = false.
[widget."avivbintangaringga/nix-monitor:nix-monitor"]
show_text = false

# Neutral instead of the default bright green (#57ff57) when up to date;
# only the update-available state keeps an alert color.
up_to_date_color = "on_surface"

# Float the panel out of the transparent bar surface (see [shell.panel]).
# Panels read entry-level keys like <entry>_placement from plugin_settings.
[plugin_settings."avivbintangaringga/nix-monitor"]
panel_placement = "floating"

# The built-in ram widget shows absolute usage; percent matches temp and cpu.
[widget.ram]
stat = "ram_pct"

[widget.battery]
show_label = false

[widget.network]
show_label = false

[widget.volume]
show_label = false
