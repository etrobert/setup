# Examples
# https://github.com/tony/tmux-config/blob/master/.tmux.conf

# activates mouse (including scrolling)
# TODO fix for retrocompatibility < 2.1
setw -g mouse on

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind R resize-pane -x 80

bind v split-window -h -l 80
bind V split-window -hb -l 80

# start window numbers at 1
set -g base-index 1

# make pane numbering consistent with windows
setw -g pane-base-index 1

# renumber windows when a window is closed
set -g renumber-windows on

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Allows for faster key repetition
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5
set -g status-left-length 200

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# -- source https://github.com/mguterl/dotfiles/blob/master/tmux.conf --

# smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"
bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys 'C-\\') || tmux select-pane -l"

# C-l is used for split navigation, so use <prefix> C-l to clear screen
bind C-l send-keys 'C-l'

# Activate focus events for vim-gitgutter vim plugin to work
set -g focus-events on

# Let apps forward escape sequences (e.g. the kitty graphics protocol used by
# timg/ils) through to the outer terminal. Off by default; without it tmux
# drops the image data and only the Unicode placeholder glyphs render.
set -g allow-passthrough on

set-option -g status-style bg=#1e2030

set-window-option -g window-status-separator ''

# Default window title colors
set-window-option -g window-status-style bg=colour0,fg=color4

set-window-option -g window-status-current-format "\
#[fg=#363a4f, bg=#8aadf4]\
#[fg=#1e2030, bg=#8aadf4, bold] #I #{?@agent-status,#{@agent-status} ,}#W \
#[fg=#8aadf4]#{?window_end_flag,#[bg=#1e2030],#[bg=#363a4f]}"

# Sessions with an agent that wants something: blocked, or finished and waiting
# on you. A working agent needs nothing, so it stays out of the bar -- the tab
# list and prefix S still show it. Claude Code hooks set @agent-status on the
# agent's window; #{W:} gathers the markers from all of a session's windows, so
# an editor window in front does not hide them.
#
# Built up with -a so the nesting can be indented: tmux ignores whitespace
# before a command, but keeps it inside a format string.
set-option -g  status-left "#[fg=colour4, bg=#363a4f] [#S] "
set-option -ag status-left "#{S:"
set-option -ag status-left   "#{?#{||:#{m:*!*,#{W:#{@agent-status}}},#{m:*✓*,#{W:#{@agent-status}}}},"
set-option -ag status-left     "#{?#{m:*!*,#{W:#{@agent-status}}},#[fg=#eed49f]#[bold],#[fg=#a6da95]#[nobold]}"
set-option -ag status-left     "#{W:#{@agent-status}} #{session_name} "
set-option -ag status-left   ",}"
set-option -ag status-left "}"

# A done marker means "look at me", so looking at it retires it and the bar
# drains as you work through the queue. Blocked survives: it clears when the
# agent is actually unblocked and reports working again.
set-hook -g pane-focus-in 'if-shell -F "#{==:#{@agent-status},✓}" "set-option -uw @agent-status"'

set-option -g status-right "\
#[fg=#363a4f, bg=#1e2030] \
#[fg=colour4, bg=#363a4f] %d/%m %H:%M \
#[fg=#8aadf4, bg=#363a4f]\
#[fg=#1e2030, bg=#8aadf4, bold] #H "

# Inactive tabs share the continuous bar; a thin chevron divides consecutive
# inactive tabs. It is a LEADING element of each tab, drawn only when the
# previous window is not the active one -- otherwise the active tab's own solid
# arrow already divides them and the separator would double up. The leading
# chevron conditional, laid out for readability (the live string can't be
# indented -- tmux keeps leading whitespace inside format strings):
#
#   #{?                                    -- if
#     #{!=:                                --   not equal
#       #{active_window_index},            --     index of the active window
#       #{e|-|:#{window_index},1}          --     this tab's index minus 1
#     },
#     #[fg=#5b6078]#[bg=#363a4f]        -- then: draw the chevron
#   ,}                                     -- else: nothing
set-window-option -g window-status-format "\
#{?#{!=:#{active_window_index},#{e|-|:#{window_index},1}},#[fg=#5b6078]#[bg=#363a4f],}\
#[fg=colour4, bg=#363a4f, noitalics] #I #{?@agent-status,#{?#{==:#{@agent-status},!},#[fg=#eed49f]#[bold],}#{@agent-status}#[fg=colour4]#[nobold] ,}#W \
#{?window_end_flag,#[fg=#363a4f]#[bg=#1e2030],}"

# Message info
set-option -g message-style bg=#1e2030,fg=colour4

bind-key s display-popup -E -w 95% -h 92% tmux-sessionizer -e

bind-key S choose-tree -Zs

set-window-option -g mode-keys vi

bind-key X confirm-before -p 'kill-session #S? (y/n)' kill-session

set-hook -g session-created 'run-shell "[ -f .tmux.conf ] && tmux source-file .tmux.conf"'
