---
name: Update Flake Inputs

"on":
  schedule:
    # UTC (GitHub's only cron timezone): 09:00-23:00 Berlin under CEST, an
    # hour earlier under CET. Waking hours only, so tower's fans stay quiet.
    - cron: "0 7-21 * * *"
  # allow manual trigger
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    # Self-hosted (tower): nix is preinstalled and ntfy is only reachable from
    # the tailnet.
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # access-tokens: the self-hosted runner's nix has no GitHub credentials,
      # and unauthenticated api.github.com calls share the household IP's
      # 60/hour budget. Applies client-side, so no trusted-user requirement.
      # The log goes to RUNNER_TEMP, not the work tree, so create-pull-request
      # does not commit it.
      - name: Update flake inputs
        id: update
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          nix flake update --accept-flake-config 2>&1 \
            | tee "$RUNNER_TEMP/update.log"
          inputs=$(grep --only-matching "Updated input '[^']*'" \
            "$RUNNER_TEMP/update.log" \
            | sed "s/Updated input '//; s/'$//" \
            | paste --serial --delimiters=, || true)
          echo "title=chore: update flake inputs${inputs:+ (${inputs//,/, })}" \
            >> "$GITHUB_OUTPUT"

          # The update is uncommitted, so HEAD still holds the old lock.
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.old"
          {
            echo "body<<EOF"
            echo "<!-- inputs -->"
            echo "| Input | Change |"
            echo "| --- | --- |"
            jq --raw-output \
              --slurpfile old "$RUNNER_TEMP/flake.lock.old" '
                def locked: . as $lock
                  | $lock.nodes.root.inputs
                  | with_entries(select(.value | type == "string"))
                  | map_values($lock.nodes[.].locked);
                ($old[0] | locked) as $before
                | locked
                | to_entries[]
                | select($before[.key].rev != .value.rev)
                | .key as $name
                | $before[$name].rev as $from
                | .value as $to
                | (if $to.type == "github" then
                     "[`\($from[0:7])` → `\($to.rev[0:7])`]"
                     + "(https://github.com/\($to.owner)/\($to.repo)"
                     + "/compare/\($from)...\($to.rev))"
                   else "`\($from[0:7])` → `\($to.rev[0:7])`"
                   end) as $change
                | "| \($name) | \($change) |"
              ' flake.lock
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body: ${{ steps.update.outputs.body }}
          branch: flake-update
          delete-branch: true

      # etrobert authors the PR, so etrobert-bot may approve it; the ruleset
      # (all-checks, all-builds, one approval) decides when auto-merge fires.
      - name: Approve and enable auto-merge
        if: steps.create.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          NUMBER: ${{ steps.create.outputs.pull-request-number }}
        run: |
          gh pr review "$NUMBER" --approve
          gh pr merge "$NUMBER" --auto --squash
