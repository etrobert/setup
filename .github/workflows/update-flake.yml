---
name: Update Flake Inputs

"on":
  schedule:
    # 06:00 and 18:00 UTC (08:00 and 20:00 Berlin during DST)
    - cron: "0 6,18 * * *"
  # allow manual trigger
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    # Self-hosted (tower): nix is preinstalled and ntfy is only reachable from
    # the tailnet.
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Update flake inputs
        run: nix flake update --accept-flake-config

      - name: Create pull request
        id: create
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: Automated flake input update.
          branch: flake-update
          delete-branch: true

      # etrobert authors the PR, so etrobert-bot may approve it; the ruleset
      # (all-checks, all-builds, one approval) decides when auto-merge fires.
      - name: Approve and enable auto-merge
        if: steps.create.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          NUMBER: ${{ steps.create.outputs.pull-request-number }}
        run: |
          gh pr review "$NUMBER" --approve
          gh pr merge "$NUMBER" --auto --squash
