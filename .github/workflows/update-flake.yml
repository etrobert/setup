---
name: Update Flake Inputs

"on":
  schedule:
    # UTC (GitHub's only cron timezone): 09:00-23:00 Berlin under CEST, an
    # hour earlier under CET. Waking hours only, so tower's fans stay quiet.
    - cron: "0 7-21 * * *"
  # allow manual trigger
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    # Self-hosted (tower): nix is preinstalled and ntfy is only reachable from
    # the tailnet.
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # access-tokens: the self-hosted runner's nix has no GitHub credentials,
      # and unauthenticated api.github.com calls share the household IP's
      # 60/hour budget. Applies client-side, so no trusted-user requirement.
      # The log goes to RUNNER_TEMP, not the work tree, so create-pull-request
      # does not commit it.
      #
      # An update is kept only if it changes some host's toplevel derivation.
      # Most bumps don't: docs, tests, or the plugins nobody here enables. A
      # drvPath is a hash of everything the system depends on, so comparing
      # them before and after is exact, and eval-only. The lock is restored
      # otherwise, so there is nothing to commit, and the bumps it would have
      # carried go to the job summary.
      - name: Update flake inputs
        id: update
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          toplevels() {
            for kind in nixos darwin; do
              nix eval ".#${kind}Configurations" --accept-flake-config --json \
                --apply 'hosts: builtins.mapAttrs
                  (_: host: host.config.system.build.toplevel.drvPath) hosts'
            done
          }
          before=$(toplevels)

          nix flake update --accept-flake-config 2>&1 \
            | tee "$RUNNER_TEMP/update.log"
          inputs=$(grep --only-matching "Updated input '[^']*'" \
            "$RUNNER_TEMP/update.log" \
            | sed "s/Updated input '//; s/'$//" \
            | paste --serial --delimiters=, || true)
          if [ -z "$inputs" ]; then
            echo "Every input is up to date."
            exit 0
          fi

          # The update is uncommitted, so HEAD still holds the old lock.
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.old"
          table=$(nix run --accept-flake-config .#flake-input-table -- \
            "$RUNNER_TEMP/flake.lock.old" flake.lock)

          after=$(toplevels)
          if [ "$after" = "$before" ]; then
            echo "No host changed; dropping: ${inputs//,/, }"
            printf '## Dropped\n\n%s\n' "$table" >> "$GITHUB_STEP_SUMMARY"
            git checkout -- flake.lock
            exit 0
          fi

          echo "title=chore: update flake inputs (${inputs//,/, })" \
            >> "$GITHUB_OUTPUT"
          printf 'body<<EOF\n%s\nEOF\n' "$table" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body: ${{ steps.update.outputs.body }}
          branch: flake-update
          delete-branch: true

      # etrobert authors the PR, so etrobert-bot may approve it; the ruleset
      # (all-checks, all-builds, one approval) decides when auto-merge fires.
      - name: Approve and enable auto-merge
        if: steps.create.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          NUMBER: ${{ steps.create.outputs.pull-request-number }}
        run: |
          gh pr review "$NUMBER" --approve
          gh pr merge "$NUMBER" --auto --squash
