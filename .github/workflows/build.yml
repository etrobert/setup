---
name: Build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs per ref when iterating fast, but never on main:
# every main commit must finish so its outputs land in tower's store, where
# harmonia serves them (pi auto-upgrades and substitutes from there).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  probe:
    name: Pick runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      # RUNNER_PROBE_TOKEN: fine-grained PAT with runners read on this
      # repo — the runners API needs a permission GITHUB_TOKEN cannot be
      # granted. An invalid token fails the probe (and the build) loudly;
      # an absent or offline runner falls back to the hosted runner.
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PROBE_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '.runners[] | select(.name == "aaron") | .status')
          if [ "$status" = "online" ]
          then runner='["self-hosted", "macOS"]'
          else runner='"macos-latest"'
          fi
          echo "aaron status: $status; picked $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  discover:
    name: discover
    needs: probe
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # Emit the build matrix from the flake: nixos hosts build on the
      # self-hosted Linux runners, darwin hosts on the runner the probe picked.
      - name: List host configurations
        id: list
        env:
          DARWIN_RUNNER: ${{ needs.probe.outputs.runner }}
        run: |
          nixos=$(nix eval .#nixosConfigurations \
            --apply builtins.attrNames --json)
          darwin=$(nix eval .#darwinConfigurations \
            --apply builtins.attrNames --json)
          # shellcheck disable=SC2016  # $-names are jq variables, not shell
          matrix=$(jq --compact-output --null-input \
            --argjson nixos "$nixos" \
            --argjson darwin "$darwin" \
            --argjson darwinRunner "$DARWIN_RUNNER" \
            '{
              include:
                [$nixos[] | {host: ., platform: "nixos",
                            runner: ["self-hosted", "Linux"]}]
              + [$darwin[] | {host: ., platform: "darwin",
                             runner: $darwinRunner}]
            }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.host }}
    needs: discover
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      # Self-hosted runners already have Nix; only the hosted fallback needs it.
      - uses: DeterminateSystems/determinate-nix-action@v3
        if: ${{ runner.environment == 'github-hosted' }}

      # Only GitHub-hosted runners (darwin builds) push to cachix. Self-hosted
      # jobs skip it: their outputs land in tower's store, served by harmonia,
      # and the action can't work there anyway — its `cachix use` needs a nix
      # trusted user, which the runner user deliberately isn't.
      # continue-on-error: cache push failures (e.g. cachix 502s) shouldn't
      # fail the job
      - uses: cachix/cachix-action@v17
        if: ${{ runner.environment == 'github-hosted' }}
        continue-on-error: true
        with:
          name: soft-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.host }}
        run: |
          attr="${{ matrix.platform }}Configurations.${{ matrix.host }}"
          nix build ".#$attr.config.system.build.toplevel" \
            --accept-flake-config \
            --print-build-logs \
            --option stalled-download-timeout 10

  # Which programs actually changed version, as opposed to which inputs moved.
  # Both toplevels are cache hits: this run just built the PR's, and main's CI
  # built main's, on this same store.
  closure-diff:
    name: closure-diff
    needs: build
    # head repo guard: a fork PR could otherwise name its branch flake-update
    # and run this job (see fix-flake-update.yml).
    if: >-
      ${{ github.event_name == 'pull_request'
        && github.head_ref == 'flake-update'
        && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
      pull-requests: write
    env:
      # access-tokens: the runner's nix has no GitHub credentials, and
      # unauthenticated fetches share the household IP's 60/hour budget.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: main
          path: main-baseline

      - name: Diff tower closures
        run: |
          attr="nixosConfigurations.tower.config.system.build.toplevel"
          nix build ".#$attr" --accept-flake-config \
            --out-link "$RUNNER_TEMP/tower-pr"
          nix build "./main-baseline#$attr" --accept-flake-config \
            --out-link "$RUNNER_TEMP/tower-main"
          nix run nixpkgs#dix -- "$RUNNER_TEMP/tower-main" \
            "$RUNNER_TEMP/tower-pr" > "$RUNNER_TEMP/diff.txt"
          nix run nixpkgs#dix -- --color always "$RUNNER_TEMP/tower-main" \
            "$RUNNER_TEMP/tower-pr" > "$RUNNER_TEMP/diff-ansi.txt"

      # GitHub markdown renders neither ANSI nor styled HTML, so the colored
      # variant ships as a PNG on the public file share (github-runner.nix
      # provides the writable dir; unique name per attempt because camo
      # caches).
      - name: Publish diff image
        id: image
        run: |
          nix run nixpkgs#charm-freeze -- "$RUNNER_TEMP/diff-ansi.txt" \
            --language ansi --output "$RUNNER_TEMP/closure-diff.png"
          name="closure-diff-pr$NUMBER-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.png"
          install --mode 0644 "$RUNNER_TEMP/closure-diff.png" \
            "/srv/files/ci/$name"
          echo "url=https://files.etiennerobert.com/ci/$name" \
            >> "$GITHUB_OUTPUT"

      - name: Update PR body
        env:
          IMAGE_URL: ${{ steps.image.outputs.url }}
        run: |
          gh pr view "$NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo "![tower closure diff (vs main)]($IMAGE_URL)"
            echo
            echo "<details><summary>tower closure diff (vs main)</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/diff.txt"
            echo '```'
            echo
            echo "</details>"
          } | nix run --accept-flake-config .#pr-body-section -- \
            closure-diff "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/new-body.md"
          gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/new-body.md"

  # Aggregation gate: the single required status. It transitively requires every
  # dynamically-discovered host build (the matrix job is failure if any leg
  # fails), so new hosts are covered without touching branch protection.
  all-builds:
    name: all-builds
    needs: [discover, probe, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify all builds succeeded
        if: >-
          ${{ contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped') }}
        run: exit 1

  deploy:
    name: deploy
    needs: all-builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git can verify the push is a fast-forward
          fetch-depth: 0

      - name: Fast-forward deploy ref
        run: git push origin HEAD:deploy
