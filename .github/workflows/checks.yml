---
name: Checks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs per ref when iterating fast, but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: format
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Format Check
        run: nix fmt . -- --ci

  eval:
    name: eval
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Flake Check (all systems, eval only)
        run: nix flake check --all-systems --no-build --accept-flake-config

  dead-packages:
    name: dead-packages
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Packages in no system derivation
        run: nix run --accept-flake-config .#nix-dead-packages

  lint:
    name: lint
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build flake checks
        run: nix run nixpkgs#nix-fast-build -- --flake .#checks.x86_64-linux

  # Aggregation gate: this is the single required status. It transitively
  # requires every job above, so new checks are covered without touching
  # branch protection.
  all-checks:
    name: all-checks
    needs: [format, eval, dead-packages, lint]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify all checks succeeded
        if: >-
          ${{ contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped') }}
        run: exit 1
