---
name: Checks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs per ref when iterating fast, but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: format
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Format Check
        run: nix fmt . -- --ci

  eval:
    name: eval
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Flake Check (all systems, eval only)
        run: nix flake check --all-systems --no-build --accept-flake-config

  # Two jobs rather than two steps: tower registers six runners for this repo,
  # so the checks overlap instead of adding up.
  dead-modules:
    name: dead-modules
    # Self-hosted: evaluates every host once per declared module, so it wants
    # tower's warm eval cache and cores.
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Flake modules no host imports
        run: nix run --accept-flake-config .#nix-dead-sweep

  dead-packages:
    name: dead-packages
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Packages in no system derivation
        run: nix run --accept-flake-config .#nix-dead-packages

  discover:
    name: discover
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7

      - name: List flake checks
        id: list
        run: |
          checks=$(nix eval .#checks.x86_64-linux \
            --apply builtins.attrNames --json)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  lint:
    name: ${{ matrix.check }}
    needs: discover
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    strategy:
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.check }}
        run: |
          nix build .#checks.x86_64-linux.${{ matrix.check }} \
            --accept-flake-config \
            --print-build-logs

  # Aggregation gate: this is the single required status. It transitively
  # requires format, eval, and every dynamically-discovered lint leg (the
  # matrix job is failure if any leg fails), so new checks are covered
  # without touching branch protection.
  all-checks:
    name: all-checks
    needs: [format, eval, dead-modules, dead-packages, discover, lint]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify all checks succeeded
        if: >-
          ${{ contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped') }}
        run: exit 1
