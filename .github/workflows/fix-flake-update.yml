---
name: Fix Flake Update

"on":
  workflow_run:
    workflows: [Checks, Build]
    branches: [flake-update]
    types: [completed]

# Checks and Build can fail on the same commit; queue the agents rather than
# letting two of them rewrite the branch at once.
concurrency:
  group: fix-flake-update

jobs:
  fix:
    name: Fix flake update
    # head_repository: a fork PR could otherwise name its branch flake-update
    # and summon the agent, with our secrets, onto the self-hosted runner.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.head_repository.full_name
          == github.repository }}
    # Self-hosted (tower): the agent reproduces failures against the local nix
    # store, and ntfy is only reachable from the tailnet.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      # BOT_TOKEN so the fix commit is pushed as etrobert-bot.
      - uses: actions/checkout@v7
        with:
          ref: flake-update
          token: ${{ secrets.BOT_TOKEN }}

      # No git identity step: the wrapper's gitconfig-bot already sets
      # etrobert-bot as the committer and routes pushes over HTTPS.
      - name: Run the fix agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Feeds gitconfig-bot's credential helper, and stands in for the
          # wrapper's agenix read, which the runner's dynamic user cannot do.
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          # The checkout's own copy, so this config lives in exactly one place.
          # The wrapper's default is under $HOME, which the runner unit hides
          # behind ProtectHome.
          CLAUDE_CONFIG_DIR: >-
            ${{ github.workspace }}/pkgs/claude-code-wrapped/config
          # Authenticated GitHub fetches for the agent's nix commands; the
          # anonymous api.github.com budget (60/hour per IP) is shared with
          # everything else behind the household IP.
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
          PROMPT: >-
            This branch is an automated flake.lock update pull request whose
            CI failed. Investigate the failure (read the CI logs with gh, or
            reproduce it with nix), fix the repository so CI passes, and
            commit the fix with a conventional commit message. Do not push.
        run: |
          nix run .#claude-code-wrapped -- \
            --print --dangerously-skip-permissions "$PROMPT"

      # The update workflow's approval predates the agent's commit, so drop
      # it — ordered before the push so a green re-run cannot auto-merge an
      # unreviewed fix. Auto-merge stays armed and fires once a human approves.
      - name: Dismiss the approval
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          number=$(gh pr view flake-update --json number --jq .number)
          pr="repos/$GITHUB_REPOSITORY/pulls/$number"
          # select(): one approval exists, and re-selecting it makes a second
          # queued run a no-op rather than a 422 on an already-dismissed one.
          gh api "$pr/reviews" --jq '.[] | select(.state == "APPROVED") | .id' \
            | xargs --no-run-if-empty --replace={} \
              gh api --method PUT --silent "$pr/reviews/{}/dismissals" \
                --field message="Superseded by the fix agent" \
                --field event=DISMISS

      # A no-op when the agent committed nothing.
      - name: Push the fix
        run: git push origin HEAD:flake-update

      # always(): a failed agent is the outcome most worth hearing about.
      - name: Notify
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          runs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          ntfy publish --quiet \
            --title "Flake update fix: $STATUS" \
            --click "$runs/$GITHUB_RUN_ID" \
            "flake-update needs a review before it can merge."
