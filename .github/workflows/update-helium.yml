---
name: Update Helium

"on":
  schedule:
    # UTC: hourly 09:00-23:00 Berlin under CEST, an hour earlier under CET.
    - cron: "0 7-21 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update the Helium pin
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Bump the Helium pin
        id: bump
        run: |
          pin=modules/pkgs/helium/pin.json
          releases=https://github.com/imputnet/helium-linux/releases
          url=$(curl --silent --show-error --head --output /dev/null \
            --write-out '%{redirect_url}' "$releases/latest")
          version=$(basename "${url:?no redirect}")
          old=$(jq --raw-output .version "$pin")
          if [ "$version" = "$old" ]; then
            echo "Helium $old is up to date."
            exit 0
          fi

          prefetch=$(nix store prefetch-file --json \
            "$releases/download/$version/helium-$version-x86_64.AppImage")
          jq --arg version "$version" \
            --arg hash "$(jq --raw-output .hash <<< "$prefetch")" \
            '.version = $version | .hash = $hash' \
            "$pin" > "$RUNNER_TEMP/helium.json"
          mv "$RUNNER_TEMP/helium.json" "$pin"
          echo "title=chore: update helium ($old → $version)" \
            >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: ${{ steps.bump.outputs.title }}
          title: ${{ steps.bump.outputs.title }}
          branch: helium-update
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          NUMBER: ${{ steps.create.outputs.pull-request-number }}
        run: gh pr merge "$NUMBER" --auto --squash
