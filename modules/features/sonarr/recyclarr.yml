---
sonarr:
  series:
    base_url: !env_var SONARR_URL
    api_key: !env_var SONARR_KEY

    # Minimums reject releases too small for their quality; no maximum.
    quality_definition:
      type: series

    quality_profiles:
      # [French VOSTFR] UHD Bluray + WEB: original audio first, MULTi fallback.
      - trash_id: d6252dce6af535107ed4b03e68052ae8
        name: Original audio
        reset_unmatched_scores:
          enabled: true
        # Radarr's order: the guide drops remux and merges Blu-ray with WEB.
        qualities:
          - name: Bluray-2160p Remux
          - name: Bluray-1080p Remux
          - name: Bluray-2160p
          - name: Bluray-1080p
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]

    custom_formats:
      # The guide's profile has no remux, so it ranks no remux encoders.
      - trash_ids:
          # Remux Tier 01, 02
          - 9965a052eb87b0d10313b1cea89eb451
          - 8a1d0c3d7497e741736761a1da866a2e
        assign_scores_to:
          - name: Original audio

    custom_format_groups:
      add:
        # [HDR Formats] DV (w/o HDR fallback): browsers can't play Dolby Vision.
        - trash_id: d776a1ea912a117d66d83b880ff2055d
