---
radarr:
  movies:
    base_url: !env_var RADARR_URL
    api_key: !env_var RADARR_KEY

    # Minimums reject releases too small for their quality; no maximum.
    quality_definition:
      type: movie

    quality_profiles:
      # [French VOSTFR] UHD Remux: original audio first, MULTi as fallback.
      - trash_id: 9b32fc61d8ec83ed131f50f1db80505a
        name: Original audio
        reset_unmatched_scores:
          enabled: true
        # Adds 1080p to the guide's 2160p-only list.
        qualities:
          - name: Remux-2160p
          - name: Remux-1080p
          - name: Bluray-2160p
          - name: Bluray-1080p
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]

    custom_formats:
      # The guide's UHD profile only ranks 2160p Blu-ray encoders.
      - trash_ids:
          # HD Bluray Tier 01, 02, 03
          - ed27ebfef2f323e964fb1f61391bcb35
          - c20c8647f2746a1f4c4262b0fbbeeeae
          - 5608c71bcebba0a5e666223bae8c9227
        assign_scores_to:
          - name: Original audio

    custom_format_groups:
      add:
        # [HDR Formats] DV (w/o HDR fallback): browsers can't play Dolby Vision.
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76
